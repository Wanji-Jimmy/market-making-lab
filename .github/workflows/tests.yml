name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=study python -m unittest discover -s tests -q
      - run: python study/lesson.py
      - run: python study/research.py --output-dir /tmp/mm-inventory-smoke --runs 3 --steps 10 --paired-resamples 10 --markout-resamples 10
      - run: python study/latency_research.py --output-dir /tmp/mm-delay-smoke --runs 2 --steps 10 --paired-resamples 10 --markout-resamples 10
