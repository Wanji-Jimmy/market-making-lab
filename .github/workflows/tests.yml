name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -v
      - name: Run the teaching ledger
        run: python lesson.py
      - name: Run a small simulation
        run: >-
          python experiment.py --runs 4 --steps 60 --sensitivity-runs 4
          --output "${{ runner.temp }}/market-making-smoke"
